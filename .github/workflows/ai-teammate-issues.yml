# AI Teammate Trigger — GitHub-issues variant (machine-kit).
#
# The missing link of the dark-factory chain: a HUMAN creates an issue and
# assigns it to the agent (or adds a label) — this workflow turns that into
# an agent run, and the existing merge-trigger-issues.yml closes the loop:
#
#   issue created → assigned to ai-teammate (or labeled agent:dev / agent:review)
#     → THIS workflow: guard → write the issue body to input/ticket.md
#       → dmtools run machine-kit/teammate-install/runners/<runner>.json
#         (runner = thin child of a dmtools-agents agent; only envVariables
#          overridden: AI_AGENT_PROVIDER=fa + FA_PROVIDER_TYPE/CONFIG)
#     → agent develops → PR with "Closes #NN"
#     → review run verdict (THIS workflow, zero human steps):
#         APPROVE + green CI on the PR head → pr_approved label →
#           merge-trigger.yml: pr_approved label → checks green → squash
#         CHANGES_REQUESTED / BLOCK → agent:rework label → rework run →
#           re-review (the labeled event re-fires this same workflow)
#
# Runner selection (agent configs run AS-IS — Teammate fills input/ from
# the issue body and executes the config through CliAgent):
#   assignee == agent handle (default "ai-teammate") OR label agent:dev
#     title [BUG]/Bug… or label bug → runners/fa-bug-dev.json   (bug_development)
#     otherwise                     → runners/fa-story-dev.json (story_development)
#   label agent:review              → runners/fa-review-kimi.json (pr_review)
#   label agent:rework              → runners/fa-rework-zai.json  (pr_rework,
#     glm-5.3-flash; fixes the linked open PR, pushes to the same branch)
#
# Keys (workflow-level separation): each runner names its key via
# FA_PROVIDER_CONFIG.apiKeyEnvVar — configure repo SECRETS with the same
# names as in machine-kit/teammate-install/dmtools.env:
#   ZAI_CODE_KEY, KIMI_REVIEW_KEY (+ SOURCE_GITHUB_TOKEN for the agent's
#   git/gh operations, inherited from the rest of the machine).
#
# Prerequisites: fa installs up front via agents/setup/install.sh
#   (idempotent, self-contained — one binary carries every AI backend),
#   version pinned in workflow env (repo var FA_VERSION overrides) and
#   cached by version. dmtools-dart installs from the pinned release
#   bundle (AOT binary + QuickJS .so, repo var DMTOOLS_VERSION overrides)
#   via install.sh — no per-run dart pub get / make native; cut a new
#   release when the CLI gains features the machine needs.
#
# Memory: fa's project memory (.fah/memory) is committed to the repo and
#   pushed after every run — agent knowledge accumulates in the repository
#   (the checkout already brings the accumulated memory back in).
#
# Sessions: run-agent.sh resumes a deterministic named fa session per
#   repo:GH-<n>:group (bug/story/rework share dev-write — a rework continues
#   the ticket's dev conversation; review has its own dev-review), and the
#   cache steps carry the session directory across CI runs.
#
# Self-contained on purpose: unlike the Jira-era reusable ai-teammate.yml,
# this template must prepare the ticket input (issue body) BEFORE the run,
# so the reusable workflow_call cannot be used here.

name: 'AI Teammate : issue assigned'

# Run title in the Actions list — mirrors the dm.ai original, where every
# run names its agent and ticket. The agent kind is derived from the event:
# the just-added label wins (labeled action), then the full label set, then
# the default dev path (assignee-triggered).
run-name: >-
  ${{ github.event.label.name == 'agent:rework' && '🔧 rework' ||
      github.event.label.name == 'agent:review' && '🔍 review' ||
      contains(github.event.issue.labels.*.name, 'agent:rework') && '🔧 rework' ||
      contains(github.event.issue.labels.*.name, 'agent:review') && '🔍 review' ||
      '⚒️ dev' }}
  · gh-${{ github.event.issue.number }}: ${{ github.event.issue.title }}

on:
  issues:
    types: [assigned, labeled]

concurrency:
  group: ai-teammate-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Cache saves were denied ("token has no writable scopes") without this:
  # actions/cache@v6 save phase needs actions:write on github.token.
  actions: write

env:
  AGENT_HANDLE: ai-teammate        # the bot account issues get assigned to
  # Prerequisite versions — repo vars override; fa defaults to the latest
  # release so the pinned-fallback can never lag a shipped feature again
  # (v0.1.324 vs the --log-file tee in v0.1.335 bit us on 2026-09-12).
  # The fa CLI cache step is skipped for 'latest' (a cached "latest" would
  # freeze the first version it saw).
  # fa is self-contained (every runner goes through AI_AGENT_PROVIDER=fa —
  # the kimi backend is FA_PROVIDER_CONFIG inside fa, no kimi CLI needed).
  FA_VERSION: ${{ vars.FA_VERSION || 'latest' }}
  DMTOOLS_VERSION: ${{ vars.DMTOOLS_VERSION || 'v0.1.5' }}
  RUNNER_BUG: machine-kit/teammate-install/runners/fa-bug-dev.json
  RUNNER_STORY: machine-kit/teammate-install/runners/fa-story-dev.json
  RUNNER_REVIEW: machine-kit/teammate-install/runners/fa-review-kimi.json
  RUNNER_REWORK: machine-kit/teammate-install/runners/fa-rework-zai.json

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      runner: ${{ steps.check.outputs.runner }}
      config: ${{ steps.check.outputs.config }}
      kind: ${{ steps.check.outputs.kind }}
    steps:
      - name: Decide whether this event is for the agent
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          ASSIGNEES: ${{ join(github.event.issue.assignees.*.login, ' ') }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ' ') }}
          ACTOR: ${{ github.event.action }}
        run: |
          # Closed issues are terminal: no agent runs on them, whatever the
          # labels say (prevents post-merge review/rework runs from looping
          # on a closed ticket).
          state="$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json state -q .state)"
          if [ "$state" != "OPEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ issue #$NUMBER is ${state} — not for the agent"
            exit 0
          fi
          runner=""
          if echo "$LABELS" | grep -qw "agent:rework"; then
            runner="$RUNNER_REWORK"
          elif echo "$LABELS" | grep -qw "agent:review"; then
            runner="$RUNNER_REVIEW"
          elif echo "$ASSIGNEES" | grep -qw "$AGENT_HANDLE" \
            || echo "$LABELS" | grep -qw "agent:dev"; then
            # [BUG]/Bug… titles (or a bug label) go to the bug agent,
            # everything else to story development.
            title="$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title)"
            if echo "$title" | grep -qiE '^\[?bug\]' \
              || echo "$LABELS" | grep -qwi "bug"; then
              runner="$RUNNER_BUG"
            else
              runner="$RUNNER_STORY"
            fi
          fi
          if [ -n "$runner" ]; then
            # Parent agent config of the runner — fa-session.sh derives the
            # session group from it (bug/story/rework share dev-write so a
            # rework RESUMES the ticket's dev conversation; review is
            # dev-review).
            case "$runner" in
              *fa-bug-dev*)      config="agents/bug_development.json"; kind="dev" ;;
              *fa-story-dev*)    config="agents/story_development.json"; kind="dev" ;;
              *fa-review-kimi*)  config="agents/pr_review.json"; kind="review" ;;
              *fa-rework-zai*)   config="agents/pr_rework.json"; kind="dev" ;;
              *)                 config="$runner"; kind="dev" ;;
            esac
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "runner=$runner" >> "$GITHUB_OUTPUT"
            echo "config=$config" >> "$GITHUB_OUTPUT"
            echo "kind=$kind" >> "$GITHUB_OUTPUT"
            echo "→ agent run: $runner (event=$ACTOR, labels=$LABELS, assignees=$ASSIGNEES)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ not for the agent (event=$ACTOR, labels=$LABELS, assignees=$ASSIGNEES)"
          fi

  teammate:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true # agents/ — inherited agent configs + run-agent.sh

      - name: Export fa session identity + cache keys
        env:
          AI_TEAMMATE_CONFIG_FILE: ${{ needs.guard.outputs.config }}
          # The ticket key of this machine: GH-<issue number> — the same key
          # the TeammateJob hydration pins as contextId.
          AI_TEAMMATE_DISPLAY_KEY: GH-${{ github.event.issue.number }}
          AI_TEAMMATE_CONCURRENCY_KEY: ${{ github.event.issue.number }}
        run: bash agents/setup/cache.sh keys fa-session

      - name: Restore fa session (resume the ticket conversation)
        uses: actions/cache@v6
        with:
          path: ${{ env.FA_SESSION_CACHE_PATH }}
          key: ${{ env.FA_SESSION_CACHE_KEY }}
          restore-keys: ${{ env.FA_SESSION_CACHE_RESTORE_KEY }}

      - name: Cache fa CLI (by version)
        # 'latest' must never be cached — a cached "latest" freezes the
        # first version it saw and defeats the point.
        if: env.FA_VERSION != 'latest'
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/fa
            ~/lib
          key: fa-${{ env.FA_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Cache dmtools CLI (by version)
        uses: actions/cache@v6
        with:
          path: ~/.dmtools/bin
          key: dmtools-${{ env.DMTOOLS_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install prerequisites (fa; no-op on cache hit)
        # register_path in the setup script exports PATH immediately and
        # persists it to GITHUB_PATH — no manual PATH edits needed here.
        run: bash agents/setup/install.sh "fa:${FA_VERSION}"

      - name: Install dmtools CLI (pinned release bundle)
        # Prebuilt AOT binary + the QuickJS shared library it loads, from
        # GitHub Releases (release-cli.yml) — no per-run dart pub get /
        # make native. The installer only edits shell profiles; CI needs
        # the explicit GITHUB_PATH line.
        run: |
          bash install.sh "${DMTOOLS_VERSION}"
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Verify prerequisites
        run: |
          fa --version
          dmtools --version

      - name: Configure Git Author + push credentials
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          git config --global user.name "dm.ai"
          git config --global user.email "dm.ai@epam.com"
          # actions/checkout persists its GitHub App token as an http
          # extraheader; that token has NO `workflows` permission, so any
          # push touching .github/workflows/* is rejected remotely
          # ("refusing to allow a GitHub App to create or update workflow").
          # When a PAT is available, drop the extraheader and route pushes
          # through the PAT instead (classic PAT with repo+workflow scopes
          # can push workflow files; the App token never can).
          if [ -n "$SOURCE_GITHUB_TOKEN" ]; then
            git config --unset-all http.https://github.com/.extraheader || true
            git config --global --unset-all http.https://github.com/.extraheader || true
            git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=${SOURCE_GITHUB_TOKEN}"; }; f'
            echo "→ git pushes will use SOURCE_GITHUB_TOKEN (workflows-capable)"
          else
            echo "::warning::SOURCE_GITHUB_TOKEN not set — pushes of workflow-file changes will be rejected (App token lacks workflows permission)"
          fi

      - name: Write the issue into the agent input folder
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # ticket.json carries the tracker-contract fields (key/number/
          # title/body/labels): dmtools hydrates it into params.ticket for
          # every JS action (GOAL.md → Core abstractions → Tracker), so
          # scripts read params.ticket.key exactly like on a Jira machine.
          mkdir -p "input/gh-${NUMBER}"
          gh issue view "$NUMBER" --repo "${{ github.repository }}" \
            --json number,title,body,url,state,labels \
            -q '{key: ("gh-" + (.number|tostring)), number: .number,
                 title: .title, body: .body, url: .url, state: .state,
                 labels: [.labels[].name]}' \
            > "input/gh-${NUMBER}/ticket.json"
          gh issue view "$NUMBER" --repo "${{ github.repository }}" \
            --json title,body -q '.title, .body' > input/ticket.md
          echo "input/ticket.md: $(wc -l < input/ticket.md) lines"
          echo "input/gh-${NUMBER}/ticket.json: $(wc -c < input/gh-${NUMBER}/ticket.json) bytes"

      - name: Run agent (fa provider via runner env overrides)
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNNER: ${{ needs.guard.outputs.runner }}
          # fa provider contract (env preconfig; the runner JSON also pins
          # these via params.envVariables — job env beats it, this step env
          # matches it. Keys: workflow-level separation, same names as
          # machine-kit/teammate-install/dmtools.env).
          AI_AGENT_PROVIDER: fa
          # fa session identity (run-agent.sh -> fa-session.sh): deterministic
          # name fa-<repo>-gh-<n>-<group>-<hash8>, resume-or-create; the cache
          # steps carry it across CI runs.
          AI_TEAMMATE_CONFIG_FILE: ${{ needs.guard.outputs.config }}
          AI_TEAMMATE_DISPLAY_KEY: GH-${{ github.event.issue.number }}
          AI_TEAMMATE_CONCURRENCY_KEY: ${{ github.event.issue.number }}
          ZAI_CODE_KEY: ${{ secrets.ZAI_CODE_KEY }}
          KIMI_REVIEW_KEY: ${{ secrets.KIMI_REVIEW_KEY }}
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # FULL session trace: run-agent.sh passes FA_LOG_FILE to
          # `fa --log-file` (fa >= v0.1.335, flutter_agent_harness#91),
          # which tees every line fa prints — assistant text and tool
          # calls, untruncated — to the file, uploaded as an artifact
          # below. dmtools mirrors child output live to its own stderr
          # (gh-50), so the agent's work already streams into this step's
          # log as it happens; the follower side-channel is gone.
          FA_LOG_FILE="${GITHUB_WORKSPACE}/.dmtools/fa-trace.log"
          export FA_LOG_FILE
          mkdir -p "$(dirname "${FA_LOG_FILE}")"
          touch "${FA_LOG_FILE}"
          echo "fa full trace: ${FA_LOG_FILE}"
          # Capture the run output for the verdict step below: the final
          # dmtools result is a JSON blob ({"success":…,"results":[{
          # "response":"# PR … verdict: …"}]}) — tee keeps it visible in
          # the step log AND on disk for `Apply the review verdict`.
          RUN_OUTPUT="${GITHUB_WORKSPACE}/.dmtools/run-output.txt"
          dmtools run "${RUNNER}" \
            --metadata '{"contextId":"gh-${{ github.event.issue.number }}"}' \
            --ciRunUrl "${CI_RUN_URL}" --debug 2>&1 | tee "${RUN_OUTPUT}"
          RC=${PIPESTATUS[0]}
          exit "${RC}"

      - name: Apply the review verdict (review runs only)
        # Zero-maintainer keystone: convert the review agent's verdict into
        # the label that drives the next machine step — nobody reads logs.
        #   APPROVE (+ green CI on the PR head) → pr_approved on the issue →
        #     merge-trigger.yml picks it up and squash-merges the linked PR.
        #   CHANGES_REQUESTED / BLOCK           → agent:rework on the issue →
        #     the labeled event re-fires this workflow with the rework runner.
        # The CI-green gate applies to the APPROVE path only: gating rework
        # on green CI would deadlock exactly when CI is red because the code
        # needs rework — and merge-trigger independently requires a CLEAN
        # merge state, so a red PR can never be merged by a stale label.
        # A PAT is REQUIRED for labeling: label events created with
        # GITHUB_TOKEN do not trigger workflows (recursion guard), the PAT
        # does — same reason as the reviewer hand-off below.
        if: needs.guard.outputs.kind == 'review'
        env:
          GH_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          RUN_OUTPUT: .dmtools/run-output.txt
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SOURCE_GITHUB_TOKEN not set — verdict labels would not trigger workflows; skipping (a maintainer must label manually)"
            exit 0
          fi
          repo="${{ github.repository }}"
          # dmtools prints the run result as ONE line of JSON on stdout at
          # the very end. gh-50 mirrors every child output line into
          # dmtools' own stderr (merged into RUN_OUTPUT via 2>&1), so the
          # file holds the whole session transcript: grepping it raw would
          # match verdict tokens the agent merely QUOTED (this workflow's
          # own CHANGES_REQUESTED / BLOCK docs, review-format files,
          # reasoning lines) and flip a genuine APPROVE into a spurious
          # agent:rework loop. Parse only the trailing result blob — the
          # last line starting with '{' — jq first, the raw line as
          # fallback. Pinned by test/ai_teammate_review_cycle_test.dart.
          result_line="$(grep '^{' "${RUN_OUTPUT}" 2>/dev/null | tail -1 || true)"
          response=""
          if [ -n "$result_line" ]; then
            response="$(printf '%s\n' "$result_line" | \
              jq -r '.results[0].response // .response // empty' 2>/dev/null || true)"
          fi
          [ -n "$response" ] || response="$result_line"
          # Verdict tokens, stricter first (a response mentioning both must
          # resolve to rework). The agent emits "CHANGES REQUESTED" /
          # CHANGES_REQUESTED / REQUEST_CHANGES or a BLOCK verdict; APPROVE
          # covers the normalized APPROVED form. 💡 SUGGESTION-only rounds
          # end in APPROVE (allowApproveWithSuggestions) — they never
          # produce a changes token.
          verdict=""
          if echo "$response" | grep -qE 'CHANGES[_ ]REQUESTED|REQUEST_CHANGES|\bBLOCK(ED)?\b'; then
            verdict="rework"
          elif echo "$response" | grep -qE '\bAPPROVE(D)?\b'; then
            verdict="approve"
          fi
          if [ -z "$verdict" ]; then
            echo "::warning::no verdict token found in the run output — skipping labeling"
            exit 0
          fi
          echo "→ review verdict: ${verdict}"
          if [ "$verdict" = "rework" ]; then
            gh issue edit "$NUMBER" --repo "$repo" --add-label "agent:rework"
            echo "→ labeled agent:rework — rework run queued (re-review follows automatically)"
            exit 0
          fi
          # APPROVE: trust the verdict only when CI on the PR head is green.
          # Linked-PR resolution mirrors merge-trigger.yml: "Closes #NN" in
          # the body, or an NN-… / ai/gh-NN branch.
          pr="$(gh pr list --repo "$repo" --state open \
            --json number,body,headRefName --jq '
            [.[] | select(
                ((.body // "") | test("(?i)\\b(closes|fixes|resolves)\\s+#'"$NUMBER"'\\b"))
                or (.headRefName | test("^'"$NUMBER"'[-_.]"))
                or (.headRefName | test("(^|[-_./])gh-0*'"$NUMBER"'$")))
              | .number] | first // empty')"
          if [ -z "$pr" ]; then
            echo "::warning::APPROVE verdict but no linked open PR for #${NUMBER} — skipping pr_approved"
            exit 0
          fi
          echo "→ linked PR #${pr} — waiting for green checks (≤10 min)"
          deadline=$((SECONDS + 600))
          while :; do
            # statusCheckRollup (unlike `gh pr checks`) never fails the
            # command on pending checks, so fail vs pending stays
            # distinguishable here.
            states="$(gh pr view "$pr" --repo "$repo" --json statusCheckRollup \
              --jq '.statusCheckRollup[] | if .status and .status != "COMPLETED"
                    then "PENDING" else (.conclusion // .state // "PENDING") end' \
              2>/dev/null || true)"
            if [ -n "$states" ]; then
              if echo "$states" | grep -qxE 'FAILURE|ERROR|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE|STALE'; then
                echo "::warning::PR #${pr} checks FAILED — verdict not trusted, no label (a fresh dev/rework round must fix CI first)"
                exit 0
              fi
              if ! echo "$states" | grep -qvxE 'SUCCESS|SKIPPED|NEUTRAL'; then
                echo "→ PR #${pr} checks green"
                break
              fi
            fi
            # empty rollup (checks not registered yet) or pending → wait
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::PR #${pr} checks still pending after 10 min — skipping pr_approved (re-label or re-run to retry)"
              exit 0
            fi
            sleep 30
          done
          gh issue edit "$NUMBER" --repo "$repo" --add-label "pr_approved"
          echo "→ labeled pr_approved — merge-trigger will squash-merge PR #${pr} once CLEAN"

      - name: Close the review cycle (review runs only)
        # A review run must never re-queue itself: whatever the agent did
        # during the session (it has been observed re-adding agent:review —
        # live loop on #49), strip the queue label at completion. Removing
        # a label fires no `labeled` event, so no new run starts.
        #
        # Accepted residual race (documented, deliberately not engineered
        # further): if the agent re-adds agent:review near the end of its
        # run, that `labeled` event has ALREADY queued one extra run in the
        # concurrency group before this step strips the label. The queued
        # run starts after this one, the guard sees no agent:* label and
        # bails — exactly one harmless bail run, never a loop (the label is
        # gone, so the bail run queues nothing further). cancel-in-progress
        # must stay false: cancelling this run mid-cleanup would leave
        # agent:review in place and re-open the loop.
        if: always() && needs.guard.outputs.kind == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
            --remove-label "agent:review" || true
          echo "→ review cycle closed (agent:review removed)"

      - name: Upload the full fa session trace
        # The full untruncated trace file. The step log streams the same
        # output live via dmtools' stderr mirroring (gh-50); the artifact
        # keeps the run readable after log expiry or outside the Actions UI.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa-trace-gh-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            .dmtools/fa-trace.log
            .dmtools/run-output.txt
          if-no-files-found: ignore

      - name: Persist fa project memory into the repository
        # fa stores project memory under <git-root>/.fah/memory (area:
        # project notes) — committing it makes agent knowledge survive
        # across runs and share between agents. Best-effort: a protected
        # default branch rejects the push, the run stays green and the
        # memory simply lives only in this run.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          git config user.name "dm.ai"
          git config user.email "dm.ai@epam.com"
          if [ -d .fah/memory ] && [ -n "$(git status --porcelain -- .fah/memory)" ]; then
            git add .fah/memory
            git commit -m "chore(fa): persist agent project memory [skip ci]"
            git push || echo "::warning::memory push rejected (protected branch?) — kept in run only"
          else
            echo "no new fa memory to persist"
          fi

      - name: Hand the issue to the reviewer (dev runs only)
        # The dev agent opened (or updated) the PR — label the issue
        # agent:review so this same workflow picks it up for pr_review.
        # Review runs carry kind=review and skip this step (no loops).
        # A PAT is REQUIRED here: label events created with GITHUB_TOKEN
        # do not trigger workflows (recursion guard), the PAT does.
        if: needs.guard.outputs.kind == 'dev'
        env:
          GH_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # Remove-then-add: re-adding an existing label is a silent no-op
          # event-wise (no `labeled` event), so the re-review would never
          # start. Removing first (ignore failure) guarantees the event fires.
          # agent:rework must go too: it survives the rework run that added
          # it, and the guard routes on it with PRIORITY over agent:review —
          # left in place, the next labeled event would re-fire the rework
          # runner instead of the reviewer (wrong loop).
          gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
            --remove-label "agent:rework" || true
          gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
            --remove-label "agent:review" || true
          gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
            --add-label "agent:review"
          echo "→ labeled agent:review (agent:rework stripped) — pr_review run queued"

      - name: Link the run back to the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" --body \
            "🤖 AI Teammate run ${OUTCOME}: ${CI_RUN_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
