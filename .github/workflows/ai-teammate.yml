name: AI Teammate
'on':
  issues:
    types: [assigned, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to run the agent on
        required: true
        type: number
      leg:
        description: Which leg to run
        required: true
        type: choice
        options:
        - dev
        - review
        - rework
      reason:
        description: Why this dispatch (audit trail, shown in logs)
        required: false
        type: string
concurrency:
  group: ai-teammate-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  factory:
    uses: IstiN/dmtools-agents/.github/workflows/factory-teammate.yml@feature/factory-reusable
    with:
      issue: ${{ github.event.issue.number || inputs.issue || '0' }}
      factory_ref: feature/factory-reusable
      leg: ${{ inputs.leg || '' }}
      reason: ${{ inputs.reason || 'stub' }}
    secrets:
      SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
      ZAI_CODE_KEY: ${{ secrets.ZAI_CODE_KEY }}
      KIMI_REVIEW_KEY: ${{ secrets.KIMI_REVIEW_KEY }}
