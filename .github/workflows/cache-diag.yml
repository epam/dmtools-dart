# TEMPORARY diagnostic for the cache-write denial (remove after #72-style fix).
# One cache step, unique key per run (always a miss → always attempts a save),
# two triggers to compare how the cache service scopes the job token:
#   workflow_dispatch  vs  issues.labeled
name: cache-diag

on:
  workflow_dispatch:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Try cache save (v6, actions: write)
        uses: actions/cache@v6
        with:
          path: /tmp/diag-a
          key: diag-a-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-a && date > /tmp/diag-a/marker

      - name: Try cache save (v6, write-all)
        permissions: write-all
        uses: actions/cache@v6
        with:
          path: /tmp/diag-b
          key: diag-b-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-b && date > /tmp/diag-b/marker

      - name: Try cache save (v4)
        uses: actions/cache@v4
        with:
          path: /tmp/diag-c
          key: diag-c-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-c && date > /tmp/diag-c/marker

      - name: Report
        run: echo "actor=${{ github.actor }} event=${{ github.event_name }} label=${{ github.event.label.name }}"
