# TEMPORARY diagnostic (v2 — fresh file so GitHub re-registers the triggers;
# the first copy created from a branch never picked up dispatch/issues events).
# Question: which arm can save an Actions cache?
#   push (merge itself)  vs  workflow_dispatch  vs  issues.labeled
# Each step uses a unique key so every run attempts a real save.
name: cache-diag2

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: A) cache v6 + actions:write
        uses: actions/cache@v6
        with:
          path: /tmp/diag-a
          key: diag2-a-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-a && date > /tmp/diag-a/marker

      - name: B) cache v6 + write-all
        permissions: write-all
        uses: actions/cache@v6
        with:
          path: /tmp/diag-b
          key: diag2-b-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-b && date > /tmp/diag-b/marker

      - name: C) cache v4
        uses: actions/cache@v4
        with:
          path: /tmp/diag-c
          key: diag2-c-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-c && date > /tmp/diag-c/marker

      - name: Report
        run: echo "actor=${{ github.actor }} event=${{ github.event_name }} label=${{ github.event.label.name }}"
