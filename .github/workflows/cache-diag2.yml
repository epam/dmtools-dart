# TEMPORARY diagnostic v3 (v2 had step-level permissions - invalid syntax).
# Question: which combination can save an Actions cache?
#   arms: push (merge itself) / workflow_dispatch / issues.labeled
#   scopes: workflow-level actions:write vs job-level write-all
#   versions: actions/cache v6 vs v4
name: cache-diag2

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: read

jobs:
  granular:
    runs-on: ubuntu-latest
    steps:
      - name: A) cache v6 + workflow-level actions:write
        uses: actions/cache@v6
        with:
          path: /tmp/diag-a
          key: diag2-a-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-a && date > /tmp/diag-a/marker

      - name: C) cache v4 + workflow-level actions:write
        uses: actions/cache@v4
        with:
          path: /tmp/diag-c
          key: diag2-c-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-c && date > /tmp/diag-c/marker

      - name: Report
        run: echo "actor=${{ github.actor }} event=${{ github.event_name }} label=${{ github.event.label.name }}"

  write-all:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: B) cache v6 + job-level write-all
        uses: actions/cache@v6
        with:
          path: /tmp/diag-b
          key: diag2-b-${{ github.run_id }}
      - run: mkdir -p /tmp/diag-b && date > /tmp/diag-b/marker
