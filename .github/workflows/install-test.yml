name: Install test

# Simulates a clean-machine install of the dmtools CLI on every supported
# system type: runs install.sh, puts the install dir on PATH, then exercises
# the binary — `dmtools --version` and `dmtools list` (no credentials needed).
#
# Two modes:
#   - pull_request touching install.sh / workflows: syntax + shellcheck always
#     run; the live-install matrix runs only when a release already exists
#     (skipped for the very first release-cli run, see release-cli.yml).
#   - workflow_dispatch: full matrix, optional `version` input pins the
#     release under test (default: latest).
#
# The repo is public (no auth needed), but the token is still passed to
# exercise the authenticated download path and avoid API rate limits.

on:
  pull_request:
    paths:
      - 'install.sh'
      - '.github/workflows/install-test.yml'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to install (optional, default: latest)'
        required: false

permissions:
  contents: read

jobs:
  syntax:
    name: install.sh syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # dash is /bin/sh on Ubuntu runners and shellcheck is preinstalled —
      # no apt round-trip (apt hung a job for 5+ minutes on 2026-08-19).
      - name: POSIX sh syntax check (dash)
        run: dash -n install.sh

      - name: shellcheck
        run: shellcheck install.sh

  install:
    name: install on ${{ matrix.os }}
    needs: syntax
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        # bash = Git Bash on the windows leg (install.sh windows branch)
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check a release exists to install
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/latest" \
            --jq .tag_name > /tmp/tag 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Latest release: $(cat /tmp/tag)"
          else
            # No releases yet (first release-cli run lands after this PR).
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No releases yet — skipping live install."
          fi

      # Git Bash (the runner's default bash) exercises the windows branch of
      # install.sh — mirrors dm.ai's windows-git-bash-installer-check.
      - name: Run install.sh (latest)
        if: steps.release.outputs.exists == 'true'
        env:
          DMTOOLS_GITHUB_TOKEN: ${{ github.token }}
        run: sh install.sh

      - name: Run install.sh (pinned version)
        if: >
          steps.release.outputs.exists == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.version != ''
        env:
          DMTOOLS_GITHUB_TOKEN: ${{ github.token }}
        run: sh install.sh "${{ github.event.inputs.version }}"

      - name: Diagnose git-bash invocation (windows)
        # The bash smoke hung for 10+ minutes while the PowerShell one
        # passed — probe each invocation shape with hard timeouts and
        # print rc/output so the actual difference is visible in the log.
        if: >
          steps.release.outputs.exists == 'true' &&
          runner.os == 'Windows'
        run: |
          bin="$HOME/.dmtools/bin"
          probe() {
            label="$1"; shift
            out=""
            if command -v timeout >/dev/null 2>&1; then
              out="$(timeout 25 "$@" 2>&1)"; rc=$?
            else
              out="$("$@" 2>&1)"; rc=$?
            fi
            echo "::group::probe: $label (rc=$rc)"
            printf '%s\n' "$out" | head -n 5
            echo "::endgroup::"
          }
          probe "exe direct"        "$bin/dmtools.exe" --version
          probe "exe, stdin closed" sh -c '"$1" --version < /dev/null' sh "$bin/dmtools.exe"
          probe "bash launcher"     "$bin/dmtools" --version
          probe "cmd via cmd //c"   cmd //c "$(cygpath -w "$bin/dmtools.cmd")" --version
          probe "exe with JSR set"  env "JSR_QUICKJS_LIB=$bin/native/quickjs/libquickjs_bridge.so" "$bin/dmtools.exe" --version
          exit 0

      - name: Exercise the installed binary
        if: steps.release.outputs.exists == 'true'
        run: |
          export PATH="$HOME/.dmtools/bin:$PATH"
          dmtools --version
          dmtools list | head -n 10
          dmtools doctor || true

  install-ps1:
    name: install.ps1 on windows
    needs: syntax
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # Job-level: BOTH steps need it (the exercise step resolves the
      # installed cmd by this path; step-level env left it empty once).
      DMTOOLS_INSTALL_DIR: ${{ github.workspace }}\.dmtools-ps1
    steps:
      - uses: actions/checkout@v4

      - name: Check a release exists to install
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/latest" \
            --jq .tag_name > /tmp/tag 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No releases yet — skipping live install."
          fi

      - name: Run install.ps1 (from the repo checkout)
        if: steps.release.outputs.exists == 'true'
        env:
          DMTOOLS_GITHUB_TOKEN: ${{ github.token }}
          DMTOOLS_INSTALL_DIR: ${{ github.workspace }}\.dmtools-ps1
        shell: pwsh
        run: ./install.ps1

      - name: Exercise the installed binary
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        run: |
          & "${env:DMTOOLS_INSTALL_DIR}\bin\dmtools.cmd" --version
          & "${env:DMTOOLS_INSTALL_DIR}\bin\dmtools.cmd" list | Select-Object -First 10
