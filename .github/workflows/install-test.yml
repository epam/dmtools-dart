name: Install test

# Simulates a clean-machine install of the dmtools CLI on every supported
# system type: runs install.sh, puts the install dir on PATH, then exercises
# the binary — `dmtools --version` and `dmtools list` (no credentials needed).
#
# Two modes:
#   - pull_request touching install.sh / workflows: syntax + shellcheck always
#     run; the live-install matrix runs only when a release already exists
#     (skipped for the very first release-cli run, see release-cli.yml).
#   - workflow_dispatch: full matrix, optional `version` input pins the
#     release under test (default: latest).
#
# The repo is public (no auth needed), but the token is still passed to
# exercise the authenticated download path and avoid API rate limits.

on:
  pull_request:
    paths:
      - 'install.sh'
      - '.github/workflows/install-test.yml'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to install (optional, default: latest)'
        required: false

permissions:
  contents: read

jobs:
  syntax:
    name: install.sh syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # dash is /bin/sh on Ubuntu runners and shellcheck is preinstalled —
      # no apt round-trip (apt hung a job for 5+ minutes on 2026-08-19).
      - name: POSIX sh syntax check (dash)
        run: dash -n install.sh

      - name: shellcheck
        run: shellcheck install.sh

  install:
    name: install on ${{ matrix.os }}
    needs: syntax
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        # bash = Git Bash on the windows leg (install.sh windows branch)
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check a release exists to install
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/latest" \
            --jq .tag_name > /tmp/tag 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Latest release: $(cat /tmp/tag)"
          else
            # No releases yet (first release-cli run lands after this PR).
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No releases yet — skipping live install."
          fi

      # Git Bash (the runner's default bash) exercises the windows branch of
      # install.sh — mirrors dm.ai's windows-git-bash-installer-check.
      - name: Run install.sh (latest)
        if: steps.release.outputs.exists == 'true'
        env:
          DMTOOLS_GITHUB_TOKEN: ${{ github.token }}
        # xtrace round: previous legs installed a 154-byte sh launcher INTO
        # dmtools.exe although the script copies the 8.7MB exe there first
        # (merge-ref inspected) — trace + dir listings to see what actually
        # runs and lands on disk.
        run: |
          # Movie mode: snapshot bin/ before EVERY line (trap DEBUG) —
          # catches the exact command at which dmtools.exe shrinks from
          # 8.7MB (copied by cp, confirmed by xtrace) to the 154-byte
          # launcher that later rounds observed.
          trace_ls() { echo "[bin] $(ls -l "$HOME/.dmtools/bin" 2>/dev/null | tail -n +2 | awk '{print $5, $9}' | tr '\n' ' ')" >&2; }
          export -f trace_ls 2>/dev/null || true
          BASH_XTRACEFD=2 sh -x install.sh &
          SHPID=$!
          (
            while kill -0 $SHPID 2>/dev/null; do
              echo "[bin] $(ls -l "$HOME/.dmtools/bin" 2>/dev/null | tail -n +2 | awk '{print $5, $9}' | tr '\n' ' ')"
              sleep 1
            done
          ) &
          WATCH=$!
          wait $SHPID || true
          kill $WATCH 2>/dev/null || true
          echo "== final bin/ =="
          ls -l "$HOME/.dmtools/bin"

      - name: Run install.sh (pinned version)
        if: >
          steps.release.outputs.exists == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.version != ''
        env:
          DMTOOLS_GITHUB_TOKEN: ${{ github.token }}
        run: sh install.sh "${{ github.event.inputs.version }}"

      - name: Diagnose git-bash invocation (windows)
        # The bash smoke hung for 10+ minutes while the PowerShell one
        # passed — probe each invocation shape with hard timeouts and
        # print rc/output so the actual difference is visible in the log.
        if: >
          steps.release.outputs.exists == 'true' &&
          runner.os == 'Windows'
        run: |
          bin="$HOME/.dmtools/bin"
          echo "== on-disk exe: size + sha256 =="
          ls -l "$bin/dmtools.exe"
          sha256sum "$bin/dmtools.exe" || certutil -hashfile "$(cygpath -w "$bin/dmtools.exe")" SHA256
          echo "== first 32 bytes =="
          head -c 32 "$bin/dmtools.exe" | od -An -tx1 | head -2

          # A/B: v0.1.11 (known-good under the ps1 leg) vs v0.1.12 (latest)
          # side by side, identical conditions.
          ab_dir="$(mktemp -d)"
          for v in v0.1.11 v0.1.12; do
            curl -fsSL "https://github.com/epam/dmtools-dart/releases/download/$v/dmtools-windows-x64.zip" -o "$ab_dir/$v.zip"
          done
          cat > "$ab_dir/ab.ps1" <<'PS1'
          param($dir)
          $ErrorActionPreference = 'Stop'
          foreach ($v in 'v0.1.11','v0.1.12') {
            Expand-Archive -LiteralPath (Join-Path $dir "$v.zip") -DestinationPath (Join-Path $dir "$v-x") -Force
          }
          PS1
          powershell -NoProfile -ExecutionPolicy Bypass -File "$ab_dir/ab.ps1" "$ab_dir"
          probe() {
            label="$1"; shift
            rc=0
            out="$(timeout 25 "$@" 2>&1)" || rc=$?
            echo "::group::probe: $label (rc=$rc)"
            printf '%s\n' "$out" | head -n 5
            echo "::endgroup::"
          }
          for v in v0.1.11 v0.1.12; do
            probe "$v direct"  "$ab_dir/$v-x/dmtools/dmtools.exe" --version
            probe "$v cmd //c"  cmd //c "$(cygpath -w "$ab_dir/$v-x/dmtools/dmtools.exe")" --version
            probe "$v powershell" powershell -NoProfile -Command "& '$(cygpath -w "$ab_dir/$v-x/dmtools/dmtools.exe")' --version"
          done
          probe "installed cmd //c" cmd //c "$(cygpath -w "$bin/dmtools.cmd")" --version
          exit 0

      - name: Exercise the installed binary
        if: steps.release.outputs.exists == 'true'
        run: |
          export PATH="$HOME/.dmtools/bin:$PATH"
          dmtools --version
          dmtools list | head -n 10
          dmtools doctor || true

  install-ps1:
    name: install.ps1 on windows
    needs: syntax
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # Job-level: BOTH steps need it (the exercise step resolves the
      # installed cmd by this path; step-level env left it empty once).
      DMTOOLS_INSTALL_DIR: ${{ github.workspace }}\.dmtools-ps1
    steps:
      - uses: actions/checkout@v4

      - name: Check a release exists to install
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/latest" \
            --jq .tag_name > /tmp/tag 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No releases yet — skipping live install."
          fi

      - name: Run install.ps1 (from the repo checkout)
        if: steps.release.outputs.exists == 'true'
        env:
          DMTOOLS_GITHUB_TOKEN: ${{ github.token }}
          DMTOOLS_INSTALL_DIR: ${{ github.workspace }}\.dmtools-ps1
        shell: pwsh
        run: ./install.ps1

      - name: Exercise the installed binary
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        run: |
          & "${env:DMTOOLS_INSTALL_DIR}\bin\dmtools.cmd" --version
          & "${env:DMTOOLS_INSTALL_DIR}\bin\dmtools.cmd" list | Select-Object -First 10
