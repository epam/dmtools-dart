name: Integration (PR)

# L3 live integration smoke tests on every PR. Unlike the nightly
# integration.yml, this runs the fast sandbox-backed subset (Jira, GitHub,
# GitLab, Confluence, ADO, Bitrise, TestRail) so a broken client fails the
# PR that broke it. Non-sensitive config comes from repository *variables*;
# credentials from repository *secrets*. Missing config fails loud
# (DMTOOLS_IT_REQUIRE_CREDS).
#
# Bitrise is read-only here by design: the write methods are gated behind
# BITRISE_ALLOW_WRITES (#2), which this workflow never sets — the PAT in
# BITRISE_TOKEN is full-account.
#
# Fork PRs do not receive secrets, so the matrix fails there by design —
# maintainers can re-run via workflow_dispatch on the branch.
on:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        integration: [jira, github, gitlab, confluence, ado, bitrise, testrail]
    concurrency:
      group: pr-integration-${{ matrix.integration }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Run ${{ matrix.integration }} live integration tests
        run: >-
          dart test -P integration -t integration
          test/integration/${{ matrix.integration }}_integration_test.dart
        env:
          DMTOOLS_IT_REQUIRE_CREDS: 'true'

          # Jira
          JIRA_BASE_PATH: ${{ vars.JIRA_BASE_PATH }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DMTOOLS_IT_JIRA_PROJECT: ${{ vars.DMTOOLS_IT_JIRA_PROJECT }}

          # GitHub
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          DMTOOLS_IT_GITHUB_REPO: ${{ vars.DMTOOLS_IT_GITHUB_REPO }}

          # GitLab
          GITLAB_BASE_PATH: ${{ vars.GITLAB_BASE_PATH }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          DMTOOLS_IT_GITLAB_PROJECT: ${{ vars.DMTOOLS_IT_GITLAB_PROJECT }}

          # Confluence
          CONFLUENCE_BASE_PATH: ${{ vars.CONFLUENCE_BASE_PATH }}
          CONFLUENCE_EMAIL: ${{ vars.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          DMTOOLS_IT_CONFLUENCE_SPACE: ${{ vars.DMTOOLS_IT_CONFLUENCE_SPACE }}

          # Azure DevOps
          ADO_ORGANIZATION: ${{ vars.ADO_ORGANIZATION }}
          ADO_PROJECT: ${{ vars.ADO_PROJECT }}
          ADO_PAT_TOKEN: ${{ secrets.ADO_PAT_TOKEN }}
          DMTOOLS_IT_ADO_PROJECT: ${{ vars.ADO_PROJECT }}

          # TestRail (sandbox creds + target are all secrets — see PR #8)
          TESTRAIL_BASE_PATH: ${{ secrets.TESTRAIL_BASE_PATH }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          DMTOOLS_IT_TESTRAIL_PROJECT: ${{ secrets.DMTOOLS_IT_TESTRAIL_PROJECT }}
          DMTOOLS_IT_TESTRAIL_SUITE: ${{ secrets.DMTOOLS_IT_TESTRAIL_SUITE }}

          # Bitrise (reads only — BITRISE_ALLOW_WRITES is deliberately unset)
          BITRISE_TOKEN: ${{ secrets.BITRISE_TOKEN }}
