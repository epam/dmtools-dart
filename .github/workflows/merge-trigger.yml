# Merge Trigger — GitHub-issues tracker variant (machine-kit heritage;
# this file is frozen — the factory pack owns merge triggering now).
#
# Historical note: this file was once template-rendered by the deleted
# machine-kit/setup.sh; all placeholder tokens are filled in below
# ("Quality" names the workflow whose green run arms the trigger).
#
# The tracker is THIS repo's GitHub issues (no Jira, no external services):
#
#   issue labeled `pr_approved` → linked PR found → required checks green
#   (branch protection is the gate: mergeStateStatus CLEAN) → squash-merge →
#   label removed → comment posted on the issue.
#
# Linking conventions (either works):
#   - PR body contains `Closes #NN` / `Fixes #NN` / `Resolves #NN`
#   - PR branch name starts with `NN-` (e.g. `42-fix-foo`)
#
# Prerequisites:
#   vars: MERGE_TRIGGER_ENABLED (fuse — job skips itself until `true`)
#   branch protection on main with required checks + strict (the machine
#   only merges CLEAN PRs, so protection defines what "ready" means).
#   No secrets needed: github.token is sufficient (merge + issues + PR write).
#   Recommended: PAT_TOKEN so auto-update-prs re-runs CI on updated branches
#   (github.token pushes do not trigger workflows) — without it, PRs updated
#   after a main push wait for any later commit before they can go CLEAN.

name: Merge Trigger

run-name: 'Merge Trigger : CI passed → merge pr_approved issues'

on:
  workflow_run:
    workflows: ['Quality']
    types: [completed]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  merge-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same-repo guard: PRs from forks must not trigger merges.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'pr_approved') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: merge-trigger-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Gate on MERGE_TRIGGER_ENABLED
        id: gate
        env:
          ENABLED: ${{ vars.MERGE_TRIGGER_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::merge-trigger scaffold is wired but disabled — set the MERGE_TRIGGER_ENABLED repo variable to true (after branch protection + required checks are in place)."
          fi

      - name: Merge issues labeled pr_approved
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: pr_approved
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          # Candidates come from BOTH sides: the issue label (human/bot)
          # and the PR label (pr_review approves via scm.addLabel on the
          # PR) — map PR labels back to their linked issues.
          issues=$(gh issue list --repo "$repo" --label "$LABEL" --state open \
            --json number --jq '.[].number')
          prs_labeled=$(gh pr list --repo "$repo" --label "$LABEL" --state open \
            --json number,body,headRefName --jq '.[] | "\(.number)\t\(.body // "")\t\(.headRefName)"')
          while IFS=$'\t' read -r prn body branch; do
            [ -n "$prn" ] || continue
            n=$(echo "$body" | grep -oiE '\b(closes|fixes|resolves)\s+#[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            [ -n "$n" ] || n=$(echo "$branch" | grep -oE '^[0-9]+' || true)
            [ -n "$n" ] || n=$(echo "$branch" | grep -oE 'gh-[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            if [ -n "$n" ]; then
              open=$(gh issue view "$n" --repo "$repo" --json state --jq .state 2>/dev/null || true)
              [ "$open" = "OPEN" ] && issues="$issues $n"
            fi
          done < <(printf '%s\n' "$prs_labeled")
          issues=$(echo $issues | tr ' ' '\n' | sort -u | tr '\n' ' ')
          if [ -z "${issues// /}" ]; then
            echo "no issues labeled '$LABEL' — nothing to merge"
            exit 0
          fi
          merged=0; skipped=0
          for n in $issues; do
            echo "::group::issue #$n"
            pr=$(gh pr list --repo "$repo" --state open \
              --json number,body,headRefName --jq '
              [.[]
                | select(
                    ((.body // "") | test("(?i)\\b(closes|fixes|resolves)\\s+#'"$n"'\\b"))
                    or (.headRefName | test("^'"$n"'[-_.]"))
                    or (.headRefName | test("(^|[-_./])gh-0*'"$n"'$"))
                  )
                | .number] | first // empty')
            if [ -z "$pr" ]; then
              echo "issue #$n: no linked open PR (add 'Closes #$n' to the PR body or name the branch '$n-…') — skipping"
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi
            state=$(gh pr view "$pr" --repo "$repo" \
              --json mergeable,mergeStateStatus \
              --jq '.mergeable + ":" + .mergeStateStatus')
            echo "linked PR #$pr — $state"
            case "$state" in
              MERGEABLE:CLEAN)
                if err=$(gh pr merge "$pr" --repo "$repo" --squash 2>&1); then
                  merged=$((merged+1))
                  gh issue edit "$n" --repo "$repo" --remove-label "$LABEL" || true
                  gh pr edit "$pr" --repo "$repo" --remove-label "$LABEL" || true
                  gh issue comment "$n" --repo "$repo" \
                    --body "🔀 Merged #$pr (CI: ${CI_RUN_URL:-run})" || true
                  echo "✅ merged #$pr for issue #$n"
                else
                  skipped=$((skipped+1))
                  echo "❌ merge of #$pr failed: $err"
                fi
                ;;
              MERGEABLE:BEHIND)
                skipped=$((skipped+1)); echo "⏳ behind main — auto-update-prs will refresh it"
                ;;
              MERGEABLE:BLOCKED|MERGEABLE:UNSTABLE)
                skipped=$((skipped+1)); echo "⏳ required checks not green yet"
                ;;
              *)
                skipped=$((skipped+1)); echo "⛔ not mergeable ($state) — needs manual attention"
                ;;
            esac
            echo "::endgroup::"
          done
          echo "summary: merged=$merged skipped=$skipped"

  # CI-failure feedback loop (the dark-factory's missing re-arm):
  # a RED Quality run on a machine branch (ai/gh-<n>) re-queues the agent
  # on the ticket — the rework run's input preparation fetches the failed
  # check logs (ci_failures.md / ci_failures_full.log via
  # preCliReworkSetup step 4.7), so the agent resumes the dev-write
  # session with the exact failure context. Without this trigger the loop
  # only closed through a review verdict: a PR whose review approved and
  # whose LATER push broke CI would sit red forever.
  # Round cap mirrors the verdict step: past MAX_AUTO_REWORK_ROUNDS the
  # machine escalates to needs-human instead of re-queueing.
  ci-failure-rework:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: ci-failure-rework-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_AUTO_REWORK_ROUNDS: 2
    steps:
      - name: Re-queue agent on CI failure (ai/gh-* branches only)
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          # Machine branches only — a HUMAN's failed PR must never wake
          # the agent (their ticket, their rules).
          n=$(echo "$BRANCH" | grep -oE '^ai/gh-([0-9]+)$' | grep -oE '[0-9]+' || true)
          if [ -z "$n" ]; then
            echo "branch '$BRANCH' is not a machine branch (ai/gh-<n>) — not our failure to fix"
            exit 0
          fi
          state=$(gh issue view "$n" --repo "$repo" --json state --jq .state 2>/dev/null || true)
          if [ "$state" != "OPEN" ]; then
            echo "issue #$n is ${state:-absent} — terminal, nothing to re-queue"
            exit 0
          fi
          labels=$(gh issue view "$n" --repo "$repo" --json labels --jq '[.labels[].name] | join(" ")')
          if echo "$labels" | grep -qw agent:skip; then
            echo "issue #$n carries agent:skip — machine bypassed"
            exit 0
          fi
          if echo "$labels" | grep -qw needs-human; then
            echo "issue #$n already escalated (needs-human) — waiting for a human"
            exit 0
          fi
          # Round cap (verdict-step parity): count rework-round-<n> labels.
          rounds=$(echo "$labels" | grep -oE 'rework-round-[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1 || echo 0)
          if [ "${rounds:-0}" -ge "$MAX_AUTO_REWORK_ROUNDS" ]; then
            gh issue edit "$n" --repo "$repo" --add-label needs-human || true
            gh issue comment "$n" --repo "$repo" --body \
              "🤖 CI red on \`$BRANCH\` ([run](${CI_RUN_URL:-run})) after $rounds rework round(s) — cap reached, escalating. The rework session's input (\`ci_failures.md\`) has the full failure context." || true
            echo "→ escalated issue #$n to needs-human (cap $MAX_AUTO_REWORK_ROUNDS)"
            exit 0
          fi
          # remove-then-add: a no-op add on an already-labeled issue fires
          # no event; the rework run strips the label at completion, but
          # belt-and-suspenders in case of a crash before the strip.
          gh issue edit "$n" --repo "$repo" --remove-label agent:rework >/dev/null 2>&1 || true
          gh issue edit "$n" --repo "$repo" --add-label agent:rework
          gh issue comment "$n" --repo "$repo" --body \
            "🔧 CI red on \`$BRANCH\` ([run](${CI_RUN_URL:-run})) — rework queued (round $((rounds + 1))); the agent will resume with the failed-check logs." || true
          echo "→ agent:rework queued on issue #$n (round $((rounds + 1)))"
