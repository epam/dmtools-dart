# SM Quality Gate — the pull_request bridge over dispatch-only CI.
#
# GitHub does not associate workflow_dispatch runs with pull requests:
# the SM-dispatched Quality run registers green check runs on the head
# SHA, but branch protection's required checks (static / gate /
# agents-suite) only read PR-ASSOCIATED check runs — they would sit
# "expected" forever and every merge would 405 (live-verified 2026-09-21
# on PR #193: "3 of 3 required status checks are expected").
#
# This bridge IS the PR association. It runs per head (pull_request
# event — cheap: one poll job + three mirror steps, no CI matrix), waits
# for the SM-dispatched Quality run (workflow_dispatch on this exact
# head SHA) and mirrors its conclusion under the required check names.
# The expensive matrix still runs ONLY when the SM dispatches it.
#
# Debris-proof verdict (2026-09-22 — same class as the live fa flaps the
# guest diagnosed in flutter_agent_harness#782, ported here because
# dmtools-dart is the sibling deployment):
#   * fetch the last 30 dispatched runs for the head, not per_page=1 —
#     CANCELLED/SKIPPED runs (SM re-dispatch churn, concurrency cancel)
#     are NEVER a verdict;
#   * the NEWEST non-debris run decides: if it is still in flight, keep
#     waiting (an in-flight rerun outranks any older green/red);
#   * poll window 85 min (timeout 90) — self-hosted pool queues ran 4h
#     live; the SM ticks every 10, so the window also absorbs SM lag;
#   * mirrors skip when the waiter was cancelled/skipped (head moved /
#     draft) — no false red "did not run" on re-run debris.

name: 'SM Quality Gate'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # A fresh head supersedes the in-flight gate (the old head's verdict is
  # irrelevant; the SM re-dispatches validation on the new head).
  group: sm-gate-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  actions: read     # poll the dispatched Quality run
  contents: read

jobs:
  sm-validation:
    name: 'sm-validation (waits for the SM-dispatched Quality run)'
    # chore:pin PRs are EXEMPT from SM validation by design (factory #498:
    # the factory suite gates pin content; the next real PR validates it via
    # silent-update). Without this skip the waiter polls a run that never
    # comes and stamps a false red "did not run" on every pin PR (live:
    # dart #221 — four red jobs, zero real checks run).
    if: ${{ !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'chore:pin') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - name: Ensure gh CLI (Bitrise images may not ship it)
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "Installing gh CLI..."
            (type -p yum >/dev/null && sudo yum install -y gh) || \
            (type -p apt-get >/dev/null && { curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt-get update -qq && sudo apt-get install -y gh; }) || \
            echo "Could not install gh — will fail below if truly absent"
          fi
          gh --version
      - name: Wait for the dispatched Quality run on this head
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # GATE_WAIT_SECONDS / GATE_POLL_SECONDS are test seams (defaults:
          # 85 min / 30 s) — unset in CI they reproduce the live values.
          deadline=$((SECONDS + ${GATE_WAIT_SECONDS:-5100}))
          poll=${GATE_POLL_SECONDS:-30}
          while [ "$SECONDS" -lt "$deadline" ]; do
            # Newest 30 dispatched runs for this head; cancelled/skipped are
            # re-dispatch debris, never a verdict. The newest NON-debris run
            # decides; if it is still running we keep waiting — an in-flight
            # rerun outranks any older green/red conclusion.
            verdict="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?event=workflow_dispatch&head_sha=${SHA}&per_page=30" \
              --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped" and .status != "queued" and .status != "waiting")] | if length == 0 then empty else .[0] | if .status == "in_progress" then "RUNNING" else .conclusion end end' 2>/dev/null || true)"
            case "$verdict" in
              success|failure|timed_out|action_required|startup_failure|neutral)
                echo "conclusion=$verdict" >> "$GITHUB_OUTPUT"
                echo "SM-dispatched Quality run concluded: $verdict"
                exit 0 ;;
              RUNNING|'')
                sleep "$poll" ;;
              *)
                # Unknown value — log and keep polling rather than guessing.
                echo "unrecognized run state: $verdict"
                sleep "$poll" ;;
            esac
          done
          echo "::error::SM-dispatched validation did not conclude within 85 min (SM tick broken or queue stalled)"
          exit 1

  static:
    name: static
    needs: sm-validation
    # Mirror only a REAL waiter verdict: cancelled/skipped waiter (head
    # moved, draft, re-run debris) must not stamp red "did not run".
    if: always() && (needs.sm-validation.result == 'success' || needs.sm-validation.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - name: Mirror the SM validation verdict
        env:
          CONCLUSION: ${{ needs.sm-validation.outputs.conclusion }}
        run: |
          [ "$CONCLUSION" = "success" ] || { echo "::error::SM validation: ${CONCLUSION:-did not run}"; exit 1; }

  gate:
    name: gate
    needs: sm-validation
    if: always() && (needs.sm-validation.result == 'success' || needs.sm-validation.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - name: Mirror the SM validation verdict
        env:
          CONCLUSION: ${{ needs.sm-validation.outputs.conclusion }}
        run: |
          [ "$CONCLUSION" = "success" ] || { echo "::error::SM validation: ${CONCLUSION:-did not run}"; exit 1; }

  agents-suite:
    name: agents-suite
    needs: sm-validation
    if: always() && (needs.sm-validation.result == 'success' || needs.sm-validation.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - name: Mirror the SM validation verdict
        env:
          CONCLUSION: ${{ needs.sm-validation.outputs.conclusion }}
        run: |
          [ "$CONCLUSION" = "success" ] || { echo "::error::SM validation: ${CONCLUSION:-did not run}"; exit 1; }
