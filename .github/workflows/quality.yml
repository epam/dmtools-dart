name: Quality

# Dispatch-only CI (2026-09 machine-loop redesign): pushes fire NO CI —
# the SM (machine-sm.yml → factory-sm) is the only trigger. It dispatches
# this workflow on the PR head when validation is due (sm rule
# validate-fresh / validate-armed), so intermediate dev/rework pushes and
# silent branch updates are free. Required checks still match: the
# dispatched run registers its check runs on the head SHA.
# Main keeps its push CI (badges + history).
on:
  workflow_dispatch: {}

concurrency:
  # PR branches: a fresh dispatch supersedes the in-flight run. Main keeps
  # every run (badges + history).
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    # Fast lane: format + analyze need no toolchain (gcc/QuickJS) — they
    # finish in ~2 min and fail the pipeline early on style/type errors.
    runs-on: bitrise-runner-dmtools-ci
    steps:
      - name: Runner disk hygiene
        # Bitrise pool machines accumulate per-run workdirs; twice on
        # 2026-09-26 a full disk killed agents-suite mid-run. Drop stale
        # dirs (>1 day) before checkout. Never touches the current
        # workspace; fresh mtimes protect concurrently running jobs.
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze

  test:
    # The suite (~2.3k tests) is sharded 4 ways — wall time drops from
    # ~17 min serial to ~5-6 min (fixed per-shard overhead ~3 min +
    # suite/4). Each shard uploads its partial lcov + test count; the
    # gate job merges them.
    runs-on: bitrise-runner-dmtools-ci
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TOTAL_SHARDS: 4
    steps:
      - name: Runner disk hygiene
        # Bitrise pool machines accumulate per-run workdirs; twice on
        # 2026-09-26 a full disk killed agents-suite mid-run. Drop stale
        # dirs (>1 day) before checkout. Never touches the current
        # workspace; fresh mtimes protect concurrently running jobs.
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
        with:
          # agents/ — the machine-wiring tests (test/machine_kit/) resolve
          # the runner configs' parents under agents/ (a submodule); without
          # the checkout, RunCommandProcessor dies with PathNotFoundException.
          submodules: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Install gcc
        run: |
          # apt hung twice on 2026-08-19 (no exit — jobs burned 19+ minutes on
          # this step before manual cancellation). Cap each attempt and retry
          # so a flaky mirror fails the job fast instead of stalling it.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -qq && \
               timeout 300 sudo apt-get install -y -qq gcc; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying in 15s"
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "apt failed after 3 attempts"
          exit 1
      - name: Build QuickJS (quickjs_runtime package)
        run: |
          PKG=$(python3 -c "import json;print([p['rootUri'] for p in json.load(open('.dart_tool/package_config.json'))['packages'] if p['name']=='quickjs_runtime'][0].replace('file://',''))")
          bash "$PKG/tool/build_quickjs.sh"
      - name: dart test (shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}) --coverage
        id: test
        # pipefail keeps a red shard red through the tee; the captured count
        # feeds the badges step (summed across shards in the gate job).
        # --reporter compact: on CI dart test auto-selects the github
        # reporter, which has no +N counters and would leave COUNT empty
        # (grep exits 1, bash -e kills the step).
        run: |
          set -o pipefail
          dart test --coverage=coverage --reporter compact \
            --total-shards "$TOTAL_SHARDS" --shard-index "${{ matrix.shard }}" \
            2>&1 | tee /tmp/test_run.log
          COUNT=$(grep -oE '\+[0-9]+' /tmp/test_run.log | tail -1 | tr -d '+' || true)
          echo "test_count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
      - run: dart pub global activate coverage
      - name: Format coverage (shard)
        run: |
          dart pub global run coverage:format_coverage \
            --lcov --in coverage --out coverage/lcov.info --report-on lib
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 1
      - name: Upload shard test count
        run: echo "${{ steps.test.outputs.test_count }}" > shard_count.txt
      - uses: actions/upload-artifact@v4
        with:
          name: count-${{ matrix.shard }}
          path: shard_count.txt
          retention-days: 1

  gate:
    # Single merge point: full coverage lcov + total test count restored
    # from the shards, then the crap4dart gates and the badges. Required
    # status check — a red shard fails this job through `needs`.
    needs: [static, test]
    runs-on: bitrise-runner-dmtools-ci
    steps:
      - name: Runner disk hygiene
        # Bitrise pool machines accumulate per-run workdirs; twice on
        # 2026-09-26 a full disk killed agents-suite mid-run. Drop stale
        # dirs (>1 day) before checkout. Never touches the current
        # workspace; fresh mtimes protect concurrently running jobs.
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - uses: actions/download-artifact@v4
        with:
          pattern: lcov-*
          path: coverage-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: count-*
          path: shard-counts
      - name: Merge shard coverage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          mkdir -p coverage
          ARGS=$(for f in coverage-shards/lcov-*/lcov.info; do printf -- '-a %s ' "$f"; done)
          # shellcheck disable=SC2086
          lcov $ARGS -o coverage/lcov.info
      - name: Sum shard test counts
        id: counts
        run: |
          TOTAL=$(cat shard-counts/count-*/shard_count.txt | awk '{s+=$1} END{print s+0}')
          echo "test_count=$TOTAL" >> "$GITHUB_OUTPUT"
      - name: Install crap4dart
        # 0.9.5: fixed the test_assertions parser limitation with trailing
        # named `skip:` args, so the two config excludes are gone. Keep this
        # pin aligned with the version the pre-commit hook runs locally.
        run: dart pub global activate crap4dart 0.9.5
      - run: crap4dart check --all
      - run: crap4dart analyze
      - name: Generate badges
        run: |
          mkdir -p .badges
          TEST_COUNT="${{ steps.counts.outputs.test_count }}"
          COV_PCT=$(grep -o 'LH:[0-9]*' coverage/lcov.info | awk -F: '{s+=$2} END{print s}')
          COV_TOTAL=$(grep -o 'LF:[0-9]*' coverage/lcov.info | awk -F: '{s+=$2} END{print s}')
          COV_FINAL=$(echo "scale=1; $COV_PCT * 100 / $COV_TOTAL" | bc 2>/dev/null || echo "0")
          CRAP="8.0"

          # shields.io flakes (503/connection blips) must not red the whole
          # pipeline — badges are cosmetic. Retry, then warn and move on
          # (the commit step already tolerates missing files).
          fetch_badge() {
            local url="$1" out="$2" attempt
            for attempt in 1 2 3; do
              if wget -q -O "$out" "$url"; then return 0; fi
              sleep 5
            done
            echo "::warning::badge fetch failed after 3 attempts: $url"
          }

          # Tests badge
          fetch_badge \
            "https://img.shields.io/badge/tests-${TEST_COUNT}%20passing-brightgreen" \
            .badges/tests.svg
          # Coverage badge
          fetch_badge \
            "https://img.shields.io/badge/coverage-${COV_FINAL}%25-brightgreen" \
            .badges/coverage.svg
          # crap4dart badge
          fetch_badge \
            "https://img.shields.io/badge/crap4dart-${CRAP}%20threshold-green" \
            .badges/crap4dart.svg
      - name: Commit badges
        # Badges belong to main only — on PR branches this step would push a
        # stray bot commit to the feature branch mid-review.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .badges/*.svg || true
          git diff --staged --quiet || git commit -m 'chore: update CI badges [skip ci]'
          git push || true

  agents-suite:
    # gh-315: the suite (92 files, 917 tests) runs in ONE sequential QuickJS
    # engine — 11m44s of wall time, the quality pipeline's long pole. It is
    # now sharded the same way dart test already is: each matrix shard
    # plans its round-robin subset (ShardPlanner), pre-flights that every
    # planned file exists and is non-empty (testRunner.js would silently
    # skip unreadable files — pre-flight turns that into a hard red), runs
    # the subset through the UNMODIFIED testRunner.js, and uploads a JSON
    # manifest of its result. fail-fast: false so every shard reports; a
    # re-dispatch retries the whole matrix (concurrency group semantics).
    #
    # N is a workflow-level constant: bump matrix + TOTAL_SHARDS together.
    # N=6, not the proposed 4: round-robin balances the file COUNT (23/23/
    # 23/23 @ N=4), but test_smAgent.js' quarter of the list carries ~47%
    # of the tests (measured shard 0 @ N=4: 432 of 917) — a 4-way split
    # keeps a ~5.5 min pole and blows the <=7 min budget once agents-gate
    # is added. Static per-file test counts (exact against the measured
    # shard) give max-shard shares of 34% @ N=4, 24% @ N=6, 22% @ N=8;
    # N=6 keeps the pole at ~4 min while adding only 2 extra jobs beyond
    # the proposal (13 total). If the Bitrise pool cannot host them, shards
    # queue — wall time degrades gracefully, correctness is unaffected.
    runs-on: bitrise-runner-dmtools-ci
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      TOTAL_SHARDS: 6
    steps:
      - name: Runner disk hygiene
        # Bitrise pool machines accumulate per-run workdirs; twice on
        # 2026-09-26 a full disk killed agents-suite mid-run. Drop stale
        # dirs (>1 day) before checkout. Never touches the current
        # workspace; fresh mtimes protect concurrently running jobs.
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
        with:
          submodules: true # agents/ = pinned IstiN/dmtools-agents (L4 suite)
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Install gcc
        run: |
          # apt hung twice on 2026-08-19 (no exit — jobs burned 19+ minutes on
          # this step before manual cancellation). Cap each attempt and retry
          # so a flaky mirror fails the job fast instead of stalling it.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -qq && \
               timeout 300 sudo apt-get install -y -qq gcc; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying in 15s"
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "apt failed after 3 attempts"
          exit 1
      - name: Build QuickJS (quickjs_runtime package)
        run: |
          PKG=$(python3 -c "import json;print([p['rootUri'] for p in json.load(open('.dart_tool/package_config.json'))['packages'] if p['name']=='quickjs_runtime'][0].replace('file://',''))")
          bash "$PKG/tool/build_quickjs.sh"
      # Pinned via the agents/ submodule instead of a floating clone so the
      # suite state is reproducible per commit. The suite hard-gates: the
      # runner requires a well-formed, fully-passing result per shard.
      - name: Run agents test suite (shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }})
        run: |
          dart run bin/run_agents_suite.dart agents \
            --shard-index "${{ matrix.shard }}" \
            --total-shards "$TOTAL_SHARDS" \
            --manifest-out "agents-suite-shard/manifest-${{ matrix.shard }}.json"
      # The manifest is machine-written JSON from our own runner (paths +
      # counts only) — the agents-gate merge job parses it, never evals it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-manifest-${{ matrix.shard }}
          path: agents-suite-shard/manifest-${{ matrix.shard }}.json
          retention-days: 1

  agents-gate:
    # gh-315: single merge point for the sharded agents suite — mirrors the
    # `gate` job that merges lcov shards. Any red shard already fails this
    # job through `needs:`; the merge additionally fails on partition
    # defects: the multiset of planned files across the downloaded
    # manifests must equal run_all.json's testFiles exactly (a lost or
    # duplicated file is red, not a silent green with fewer tests), and
    # every manifest must report a fully-passing shard. Manifests are
    # parsed as data, never evaled. Required status check (like `gate`).
    needs: [agents-suite]
    runs-on: bitrise-runner-dmtools-ci
    steps:
      - name: Runner disk hygiene
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
        with:
          # agents/ is the partition's ground truth: the gate compares the
          # merged manifests against the pinned run_all.json list.
          submodules: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - uses: actions/download-artifact@v4
        with:
          pattern: agents-manifest-*
          path: agents-manifests
      - name: Merge shard manifests (partition + all-green)
        run: |
          dart run scripts/agents_shard_gate.dart \
            agents-manifests agents/js/unit-tests/run_all.json
