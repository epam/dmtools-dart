name: Quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Install gcc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc
      - name: Compile QuickJS
        run: |
          cd native/quickjs
          gcc -shared -fPIC -O2 -D_GNU_SOURCE \
            -DCONFIG_VERSION='"2024-01-13"' -I. \
            -o libquickjs_bridge.so ../quickjs_bridge.c \
            quickjs.c libregexp.c libunicode.c cutils.c quickjs-libc.c libbf.c \
            -lm -ldl -lpthread
      - run: dart format --set-exit-if-changed .
      - run: dart analyze
      - run: dart test --coverage=coverage
      - run: dart pub global activate coverage
      - name: Format coverage
        id: coverage
        run: |
          dart pub global run coverage:format_coverage \
            --lcov --in coverage --out coverage/lcov.info --report-on lib
          COV=$(grep -o 'end_of_record' coverage/lcov.info | wc -l)
          echo "lines=$(wc -l < coverage/lcov.info)" >> $GITHUB_OUTPUT
      - name: Install crap4dart
        run: dart pub global activate crap4dart
      - run: crap4dart check --all
      - run: crap4dart analyze
      - name: Generate badges
        run: |
          mkdir -p .badges
          TEST_COUNT=$(dart test --concurrency=1 2>&1 | grep -oE '\+[0-9]+' | tail -1 | tr -d '+')
          COV_PCT=$(grep -o 'LH:[0-9]*' coverage/lcov.info | awk -F: '{s+=$2} END{print s}')
          COV_TOTAL=$(grep -o 'LF:[0-9]*' coverage/lcov.info | awk -F: '{s+=$2} END{print s}')
          COV_FINAL=$(echo "scale=1; $COV_PCT * 100 / $COV_TOTAL" | bc 2>/dev/null || echo "0")
          CRAP="8.0"

          # Tests badge
          wget -q -O .badges/tests.svg \
            "https://img.shields.io/badge/tests-${TEST_COUNT}%20passing-brightgreen"
          # Coverage badge
          wget -q -O .badges/coverage.svg \
            "https://img.shields.io/badge/coverage-${COV_FINAL}%25-brightgreen"
          # crap4dart badge
          wget -q -O .badges/crap4dart.svg \
            "https://img.shields.io/badge/crap4dart-${CRAP}%20threshold-green"
      - name: Commit badges
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .badges/*.svg || true
          git diff --staged --quiet || git commit -m 'chore: update CI badges [skip ci]'
          git push || true

  agents-suite:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Install gcc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc
      - name: Compile QuickJS
        run: |
          cd native/quickjs
          gcc -shared -fPIC -O2 -D_GNU_SOURCE \
            -DCONFIG_VERSION='"2024-01-13"' -I. \
            -o libquickjs_bridge.so ../quickjs_bridge.c \
            quickjs.c libregexp.c libunicode.c cutils.c quickjs-libc.c libbf.c \
            -lm -ldl -lpthread
      - name: Clone dmtools-agents
        run: git clone --depth 1 https://github.com/IstiN/dmtools-agents /tmp/dmtools-agents
      - name: Run agents test suite
        run: dart run bin/run_agents_suite.dart /tmp/dmtools-agents
        continue-on-error: true
