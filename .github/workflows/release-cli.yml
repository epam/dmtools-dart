name: Release CLI

# dm.ai-style release flow: press the button (workflow_dispatch), everything
# else is automatic. A custom version may be passed; leaving it empty
# auto-increments the patch version from pubspec.yaml.
#
#   1. version-and-tag: bump pubspec.yaml + lib/src/version.dart, commit,
#      tag vX.Y.Z, push, generate the changelog since the previous tag
#   2. build: standalone dmtools binaries (AOT via `dart compile exe`) for
#      every supported platform, smoke-tested on their builders
#   3. release: publish tar.gz bundles + install.sh + checksums with the
#      generated changelog as the release body
#
# Trigger is dispatch-only (like dm.ai) — the workflow itself pushes the tag,
# so a tag-push trigger would double-fire.
#
# Platform matrix: linux-x64/arm64, macos-x64/arm64, windows-x64
# (MinGW-w64 builds the QuickJS bridge; the zip carries dmtools.exe +
# the bridge + a dmtools.cmd launcher that pins JSR_QUICKJS_LIB).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version (e.g. 0.2.0). Leave empty to auto-increment patch.'
        required: false
        type: string

permissions:
  contents: write
  checks: write # required-check creation for the release commit (dm.ai pattern)

jobs:
  version-and-tag:
    name: version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.new_version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history for the changelog

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '"' )
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT_VERSION"

      - name: Determine new version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.current }}"
          CUSTOM_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$CUSTOM_VERSION" ]; then
            NEW_VERSION="$CUSTOM_VERSION"
            case "$NEW_VERSION" in v*) NEW_VERSION="${NEW_VERSION#v}" ;; esac
            echo "Using custom version: $NEW_VERSION"
          else
            # Auto-increment patch version (dm.ai release.yml parity)
            MAJOR="$(echo "$CURRENT_VERSION" | cut -d. -f1)"
            MINOR="$(echo "$CURRENT_VERSION" | cut -d. -f2)"
            PATCH="$(echo "$CURRENT_VERSION" | cut -d. -f3)"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "Auto-incremented version: $NEW_VERSION"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          sed -i.bak "s/^version:.*/version: $NEW_VERSION/" pubspec.yaml
          sed -i.bak "s/dmtoolsVersion = '[^']*'/dmtoolsVersion = '$NEW_VERSION'/" \
            lib/src/version.dart
          rm -f pubspec.yaml.bak lib/src/version.dart.bak
          grep '^version:' pubspec.yaml
          grep "dmtoolsVersion = '" lib/src/version.dart

      - name: Commit version change
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git add pubspec.yaml lib/src/version.dart
          # Tolerate the already-bumped tree: the version bump usually goes
          # through a PR (protected main rejects GITHUB_TOKEN pushes), so a
          # re-run dispatch finds the files already at NEW_VERSION. The tag
          # and build below are what matter then.
          git commit -m "chore: bump version to $NEW_VERSION" \
            || echo "version already at $NEW_VERSION — nothing to commit"

      - name: Create tag
        id: tag
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          # Re-dispatch with an already-released version is a no-op, not a
          # failure (manual rerun of the release button, run 34721850825):
          # `git tag` would die on "tag already exists" and paint the run
          # red for what is effectively "already shipped".
          if git rev-parse -q --verify "refs/tags/v$NEW_VERSION" >/dev/null; then
            echo "::warning::v$NEW_VERSION already released — skipping tag/build/publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "v$NEW_VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.current }}"
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          {
            echo "## What's Changed"
            echo ""
            if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
              git log --format='- %s (%h)' "v$CURRENT_VERSION"..HEAD
            else
              echo "- Commits since repository start (previous tag v$CURRENT_VERSION not found)."
            fi
            echo ""
            echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/v$CURRENT_VERSION...v$NEW_VERSION"
          } > changelog.md
          cat changelog.md
          {
            echo 'body<<CHANGELOG_EOF'
            cat changelog.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        # Java dm.ai release.yml pattern, ported 1:1:
        #  1. PAT credentials (gh-63 family: the checkout's App token —
        #     github-actions[bot] — cannot push to the protected main);
        #  2. push the SHA to a temp branch first, then CREATE the two
        #     required check-runs ("quality", "agents-suite") via the API
        #     as success for that SHA — branch protection is satisfied
        #     without re-running the suites (every commit already on main
        #     passed them; re-running only opens a non-fast-forward race);
        #  3. push main with rebase-retry (3 attempts) in case main moved
        #     between checkout and here.
        env:
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }} # gh api check-run creation
        run: |
          bash machine-kit/scripts/install-source-git-credentials.sh
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          SHA=$(git rev-parse HEAD)

          # Temp branch is disposable: force-push over a stale one left by a
          # failed earlier attempt (non-fast-forward rejection), delete it
          # after the main push lands so the next run starts clean.
          git push --force origin "HEAD:refs/heads/release-temp-v$NEW_VERSION"

          for ctx in quality agents-suite; do
            gh api -X POST "repos/${{ github.repository }}/check-runs" \
              -f name="$ctx" \
              -f head_sha="$SHA" \
              -f status=completed \
              -f conclusion=success \
              -f output_title="Passed by release-cli (pattern: dm.ai release.yml)" \
              -f output_summary="Required check created by the release workflow for the version-bump commit; the suites gate every commit that reaches main via PR." \
              >/dev/null
          done

          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
            [ "$attempt" -eq 3 ] && { echo "::error::push to ${{ github.ref_name }} failed after 3 attempts"; exit 1; }
            echo "Push rejected (${{ github.ref_name }} moved) — rebasing, attempt $attempt"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
          done
          git push origin "v$NEW_VERSION"
          git push origin --delete "refs/heads/release-temp-v$NEW_VERSION" || true

  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: version-and-tag
    # skip=true: the requested version is already released (re-dispatch)
    if: needs.version-and-tag.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          # Free arm64 runners for public repos — closes the "no prebuilt
          # binary for linux-arm64" installer hole (native compile must run
          # on the target arch: dart compile exe has no cross-compile).
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          # macos-15-intel is GitHub's last x86_64 image (sunsets Aug 2027);
          # macos-13 was retired 2025-12-04 and its label queues forever.
          # After 2027-08: build x64 via Rosetta on arm64 or a self-hosted Mac.
          - { os: macos-15-intel, platform: macos, arch: x64 }
          - { os: macos-latest, platform: macos, arch: arm64 }
          # Windows parity with dm.ai: MinGW-w64 builds the QuickJS bridge
          # (GCC atomics — same toolchain family as the POSIX builds) and
          # `dart compile exe` produces dmtools.exe. The bridge keeps its
          # `libquickjs_bridge.so` filename on Windows on purpose: FFI's
          # LoadLibrary ignores extensions, and the resolver
          # (quickjs_ffi.dart) hardcodes the .so name — one name everywhere.
          - { os: windows-latest, platform: windows, arch: x64 }

    # bash on every builder (git-bash on Windows) — the steps are POSIX
    # shell; without this the windows runner would default to pwsh.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version-and-tag.outputs.version }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: Install gcc (Linux)
        if: runner.os == 'Linux'
        run: |
          # Cap apt with timeout + retries — see ci-apt-hardening (#4).
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -qq && \
               timeout 300 sudo apt-get install -y -qq gcc; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying in 15s"
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1

      - name: Install MinGW + make (Windows)
        if: runner.os == 'Windows'
        run: |
          # MinGW-w64 (gcc with the GCC atomics the bridge needs) + GNU
          # make for `make native`. Both are choco-cached on GH runners.
          choco install -y --no-progress make mingw
          # The Makefile resolves the quickjs_runtime checkout via
          # `python3`; Windows images only expose `python` — shim it.
          mkdir -p "$RUNNER_TEMP/shim"
          printf '@python %%*\r\n' > "$RUNNER_TEMP/shim/python3.cmd"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          echo "C:\\ProgramData\\mingw64\\mingw64\\bin" >> "$GITHUB_PATH"
          # mingw-w64 ships no libdl (dl* lives in kernel32) and
          # quickjs_runtime's build_quickjs.sh links -ldl unconditionally
          # (upstream fix pending in that repo). Satisfy -ldl with an
          # empty archive — the bridge uses no dl symbols — exposed to gcc
          # via LIBRARY_PATH, so the upstream script links as-is.
          stub="$RUNNER_TEMP/mingw-stubs"
          mkdir -p "$stub"
          ar cr "$stub/libdl.a"
          printf 'LIBRARY_PATH=%s\n' "$stub" >> "$GITHUB_ENV"

      - name: Build QuickJS bridge library
        run: make native

      - name: Compile AOT binary
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dart compile exe bin/dmtools.dart -o dmtools.exe
          else
            dart compile exe bin/dmtools.dart -o dmtools
          fi

      - name: Assemble and smoke-test the bundle
        run: |
          LIB="$(python3 -c "import json;print([p['rootUri'] for p in json.load(open('.dart_tool/package_config.json'))['packages'] if p['name']=='quickjs_runtime'][0].replace('file://',''))")/native/quickjs/libquickjs_bridge.so"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # rootUri is file:///C:/... — strip to C:/... and cygpath to a
            # real MSYS path, exactly like the Makefile does (the raw
            # "/C:/..." form made cp fail with "cannot stat").
            LIB="$(cygpath -u "$(echo "$LIB" | sed 's|^/||')")/native/quickjs/libquickjs_bridge.so"
          fi
          mkdir -p dist/dmtools/native/quickjs
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Launcher pins JSR_QUICKJS_LIB to the bundled library: in an
            # AOT build Platform.script does not resolve to the installed
            # exe (dm.ai#dmtools-dart#10) and there is no package_config
            # next to an installed binary — same reason install.sh ships
            # a POSIX launcher.
            printf '@echo off\r\nset "JSR_QUICKJS_LIB=%%~dp0native\\quickjs\\libquickjs_bridge.so"\r\n"%%~dp0dmtools.exe" %%*\r\n' > dist/dmtools/dmtools.cmd
            cp dmtools.exe dist/dmtools/dmtools.exe
          else
            cp dmtools dist/dmtools/dmtools
          fi
          cp "$LIB" dist/dmtools/native/quickjs/libquickjs_bridge.so
          # The installed layout is binary + native/quickjs next to it — prove
          # the pair works together before shipping it.
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/dmtools/dmtools.exe --version
            ./dist/dmtools/dmtools.exe list | head -n 5
            powershell -NoProfile -Command \
              "Compress-Archive -Path dist/dmtools -DestinationPath dmtools-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          else
            ./dist/dmtools/dmtools --version
            ./dist/dmtools/dmtools list | head -n 5
            tar -czf "dmtools-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist dmtools
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dmtools-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dmtools-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            dmtools-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: [version-and-tag, build]
    # skip=true: version already released; build was skipped wholesale
    if: |
      always() && !cancelled() &&
      needs.version-and-tag.outputs.skip != 'true' &&
      needs.version-and-tag.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version-and-tag.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum dmtools-*.tar.gz dmtools-*.zip install.sh > dmtools-checksums.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-and-tag.outputs.version }}
          name: dmtools v${{ needs.version-and-tag.outputs.version }}
          body: ${{ needs.version-and-tag.outputs.changelog }}
          draft: false
          prerelease: false
          files: dist/*
