name: dmtools
description: >-
  Pure Dart port of DMTools — enterprise dark-factory orchestrator
  (Jira, ADO, GitHub, Confluence, AI providers) with a QuickJS
  scripting runtime. See GOAL.md.
version: 0.1.21
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.7
  dio: ^5.4.0
  html: ^0.15.5
  native_synchronization: ^0.3.1
  quickjs_runtime:
    git:
      url: https://github.com/IstiN/quickjs_runtime.git
      ref: feat/timers-events-microtasks # TODO: flip to main when jsr PRs #5/#7/#8 merge

dev_dependencies:
  test: ^1.24.0
